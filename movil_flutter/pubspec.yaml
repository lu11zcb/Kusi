name: kusi_flutter
description: Juego móvil Kusi para desarrollo local.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1
  material_ui: ^1.1.0
  shared_preferences: ^2.5.3
  http: ^1.5.0
  web: ^1.1.1
  flutter_tts: ^4.2.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/art/nunito.ttf
    - family: Baloo
      fonts:
        - asset: assets/art/baloo2.ttf
  assets:
    - assets/app/
    - assets/app/art/
    - assets/art/
    - assets/juego/
    - assets/juego/assets/
    - assets/juego/dibujos/
    - assets/juego/dibujos/interfaz/
    - assets/juego/dibujos/mundo/
    - assets/juego/dibujos/objetos/
    - assets/juego/dibujos/personajes/
    - assets/juego/sonidos/
