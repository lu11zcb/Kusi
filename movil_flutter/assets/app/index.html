<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kusi · Flutter</title><style>
@font-face{font-family:Nunito;src:url('art/nunito.ttf')}@font-face{font-family:Baloo;src:url('art/baloo2.ttf')}*{box-sizing:border-box}body{margin:0;background:#eee7db;color:#593629;font-family:Nunito,system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #dc8b32;outline-offset:3px}.layout{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:65px;padding:24px}.intro{width:280px}.brand{font:800 79px/1 Baloo;color:#69402b;margin:0}.intro h2{font:700 30px/1.18 Baloo;margin:22px 0 14px}.intro p{color:#927d65;line-height:1.7}.eyebrow{font-size:10px;letter-spacing:2px;border:1px solid #d5c6b0;border-radius:25px;padding:10px 14px;display:inline-block;margin-top:18px;font-weight:900}.intro a{display:block;color:#7e705c;font-size:13px;margin-top:20px}.phone{height:min(860px,calc(100dvh - 48px));min-height:630px;width:399px;background:#fff9ee;border:5px solid #fffdf7;border-radius:35px;box-shadow:0 25px 70px #5936291f;overflow:hidden;display:flex;flex-direction:column;position:relative}.status{height:28px;padding:7px 23px 0;display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:.7px;flex-shrink:0}.header{padding:14px 19px 7px;display:flex;align-items:center;gap:8px;min-height:68px}.header h1{font:800 24px/1.08 Baloo;margin:0;flex:1}.logo{font:800 35px/1 Baloo;color:#e68153;flex:1}.iconbtn{border:0;border-radius:50%;background:#fff0d9;color:#d97e51;height:37px;width:37px;display:grid;place-items:center;font-size:20px;flex-shrink:0}.mini-avatar{width:41px;height:41px;object-fit:contain}.body{padding:10px 23px 24px;overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#e4d4bc transparent}.body.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:0}.title{font:800 31px/1.08 Baloo;text-align:center;margin:13px 0;color:#593629}.caption{font-size:14px;line-height:1.5;color:#8e785f;text-align:center;margin:10px 0 18px}.art{height:240px;width:100%;position:relative;display:grid;place-items:center;margin:4px 0 12px}.art:before{content:'';position:absolute;inset:27% 4% 5%;border-radius:50%;background:#e6edcc}.art:after{content:'🌿';position:absolute;left:0;bottom:0;font-size:40px}.art img{height:100%;max-width:98%;object-fit:contain;z-index:1}.art.small{height:175px;margin-top:0}.art.pet{height:210px}.art.pet img{transform:scale(.96)}.art.pet:after{content:'🌼';left:auto;right:0;font-size:34px}.primary,.outline{display:flex;align-items:center;justify-content:center;gap:9px;border-radius:17px;min-height:48px;width:100%;border:1px solid transparent;background:linear-gradient(#299b4d,#19813c);color:white;font-weight:900;font-size:18px;padding:10px 14px;box-shadow:0 3px 0 #17672e;margin:9px 0}.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #17672e}.outline{background:transparent;border-color:#4c9b55;color:#278744;box-shadow:none;font-size:16px}.textbtn{background:none;border:0;color:#8c765f;text-decoration:underline;display:block;font-size:12px;margin:13px auto;padding:5px}.input{display:flex;align-items:center;background:#fffdf9;border:1px solid #e7d8c0;border-radius:16px;margin:13px 0;padding:0 13px;gap:9px;min-height:51px}.input input{background:none;border:0;min-width:0;width:100%;outline:none;font-size:15px;padding:13px 0;color:#593629}.input:focus-within{border-color:#398c47;box-shadow:0 0 0 2px #368c4720}.input button{background:none;border:0;color:#876b51}.check{display:flex;align-items:center;gap:7px;font-size:12px;margin:10px 0 20px}.check input{accent-color:#218d45}.error{color:#af4f32;font-size:12px;line-height:1.4;padding:10px;background:#ffeddf;border-radius:12px}.nav{display:flex;justify-content:space-between;padding:10px 12px 13px;border-top:1px solid #ebdcc4;background:#fffcf6;gap:4px;flex-shrink:0}.nav button{border:0;background:none;border-radius:17px;flex:1;color:#624431;padding:7px 4px;font-size:10px;font-weight:900}.nav span{font-size:22px;display:block;height:28px;line-height:27px}.nav .active{background:#e5f0c6;color:#248740}.fur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:9px 0 17px}.fur{background:#fffcf6;border:1px solid #e8d7bf;border-radius:15px;padding:7px 3px;font-size:10px;font-weight:900;color:#593629;position:relative;min-height:86px}.fur.selected{border:2px solid #3e9952;background:#eaf0d7}.fur.selected:after{content:'✓';position:absolute;right:5px;top:3px;color:#288b41}.fur img{height:50px;width:100%;object-fit:contain;display:block}.fur1{filter:sepia(.3) saturate(.5) brightness(1.16)}.fur2{filter:grayscale(1)}.fur3{filter:sepia(.3) saturate(1.4)}.locked{border-radius:15px;background:#eee5d9;padding:12px 14px;display:flex;align-items:center;gap:12px;margin:8px 0;color:#a28a72}.locked strong{font-size:13px;display:block;color:#8b735f}.locked small{font-size:10px}.section-label{font-weight:900;font-size:15px;margin:15px 0 8px}.banner{height:91px;background:#e6edcc;border-radius:22px;display:flex;align-items:center;overflow:hidden;padding-left:15px;margin-bottom:20px}.banner strong{font:800 20px/1.1 Baloo;flex:1}.banner img{height:107px;width:120px;object-fit:contain;align-self:flex-start}.rowtitle{display:flex;justify-content:space-between;align-items:center}.rowtitle h2{font:800 23px Baloo;margin:0}.rowtitle small{font-size:10px;color:#987c5c}.activity{padding:13px 12px;border-radius:22px;border:1px solid #e6d7be;background:#fffdf9;display:flex;align-items:center;gap:12px;margin:12px 0}.activity .symbol{width:65px;height:78px;border-radius:17px;background:#f5ecd9;display:grid;place-items:center;font-size:36px;flex-shrink:0}.activity .details{flex:1}.activity h3{font:800 20px/1.04 Baloo;margin:5px 0 8px}.pill{border-radius:7px;background:#def0ef;padding:2px 7px;font-size:9px;font-weight:900;display:inline-block}.pill.pause{background:#ffebb2}.pill.done{background:#e1edbc}.activity button{font-size:13px;min-height:30px;border-radius:20px;margin:0;padding:3px 9px;box-shadow:none}.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:9px}.course{background:var(--tint);border:1.5px solid #ffffffa0;border-radius:22px;min-height:123px;padding:12px 9px;color:#593629}.course span{font-size:34px;display:block;line-height:1.2}.course strong{font:800 19px/1 Baloo;display:block;margin:9px 0 6px}.course:last-child{grid-column:1 / -1;min-height:85px;display:flex;align-items:center;justify-content:center;gap:20px}.course:last-child strong{margin:0}.pronto{border-radius:20px;padding:3px 15px;background:#e2edbc;color:#29813b;display:inline-block;font-size:11px;font-weight:900}.points{background:#ffebbc;border-radius:24px;display:flex;align-items:center;padding:17px 9px;margin-bottom:24px}.points img{height:135px;width:145px;object-fit:contain}.points .info{text-align:center;flex:1}.points .cup{font-size:39px}.points h2{font:800 23px Baloo;margin:0 0 6px}.medals{display:flex;justify-content:space-around;margin:17px 0 25px}.medals div{text-align:center;font-size:11px;font-weight:900;line-height:1.2}.medals span{font-size:40px;display:block;filter:grayscale(.8);opacity:.5;margin-bottom:6px}.panel{padding:17px;border:1px solid #e7d8bf;border-radius:23px;text-align:center;margin-top:15px;background:#fffcf6}.panel h2{font:800 22px Baloo;margin:0 0 12px}.panel p{font-size:13px;margin:15px 0}.toggle-row{display:flex;align-items:center;justify-content:space-between;min-height:55px;font-size:14px;font-weight:900}.toggle{appearance:none;width:40px;height:23px;background:#c8c7b9;border-radius:20px;position:relative;cursor:pointer}.toggle:checked{background:#2c9648}.toggle:after{content:'';position:absolute;width:17px;height:17px;background:#fff;top:3px;left:3px;border-radius:50%;transition:left .15s}.toggle:checked:after{left:20px}.demo-note{font-size:9px;letter-spacing:1px;text-align:center;color:#927c5e;background:#f2e7d0;padding:5px;flex-shrink:0}.overlay{position:absolute;inset:0;background:#38271bc9;display:flex;align-items:center;justify-content:center;padding:26px;z-index:10}.dialog{width:100%;background:#fff8e9;border:2px solid #edc461;border-radius:29px;padding:22px;text-align:center;box-shadow:0 15px 40px #0004}.dialog h2{font:800 29px/1.05 Baloo;margin:13px 0}.dialog p{font-size:12px}.hold{position:relative;overflow:hidden;width:100%;border:1px solid #d8af72;border-radius:17px;padding:14px;background:#f7e9ce;color:#593629;font-weight:900;touch-action:none;user-select:none}.hold:before{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--progress,0%);background:#ffdb80}.hold span{position:relative;pointer-events:none}.game{position:absolute;inset:0;z-index:20;background:#8fd0ef;display:flex;flex-direction:column}.game header{display:flex;align-items:center;justify-content:space-between;background:#fff9ee;padding:8px 12px;font-size:11px}.game iframe{width:100%;flex:1;border:0}.help{position:fixed;right:15px;bottom:14px;color:#8e7d68;font-size:10px}.empty-title{margin-top:3px}.tall-gap{height:15px}@media(max-width:750px){.intro,.help{display:none}.layout{padding:0;min-height:100dvh}.phone{height:100dvh;min-height:0;border:0;width:100%;max-width:460px;border-radius:0;box-shadow:none}.status{display:none}.header{padding-top:19px}.body.welcome .art{height:min(44dvh,310px)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="layout"><aside class="intro"><p class="brand">Kusi</p><h2>Pequeñas aventuras.<br>Grandes descubrimientos.</h2><p>Aprender, jugar y crecer<br>con un amigo muy especial.</p><span class="eyebrow">APP FLUTTER · KUSI</span><a href="http://127.0.0.1:5173/" target="_blank">Abrir panel de administración y docentes ↗</a><a href="http://127.0.0.1:5174/" target="_blank">Abrir el juego ↗</a></aside><section class="phone" aria-label="Kusi, vista móvil"><div class="status"><span>12:41</span><span>● ▰ ▰</span></div><div id="app" style="display:contents"></div><div id="modal"></div></section></main><div class="help">Kusi · Aplicación Flutter</div><script>
const $=s=>document.querySelector(s), art='art/kusi-welcome.png',pet='art/kusi-pet.png';
let state={page:'welcome',tab:0,course:null,fur:+localStorage.getItem('kusi_fur')||0,voice:localStorage.getItem('kusi_voice')!=='false',demo:false,user:null,games:[],error:null};
const courses=[['Matemática','🔢','#e8ddf5'],['Comunicación','📖','#ffecc5'],['Personal Social','🐹','#f8dee5'],['Ciencia y Tecnología','🌎','#dcecd8'],['Arte y Cultura','🎨','#e7dff7'],['Educación Religiosa','💛','#ffe6d5'],['Inglés','🌍','#e7ddf3']];
const examples=[{id:'demo1',titulo:'Cuenta las frutas',status:'pause'},{id:'demo2',titulo:'El laberinto de frutas',status:'new'},{id:'demo3',titulo:'Patrones de frutas',status:'done'}];
let csrf='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(page){state.page=page;state.error=null;render()}
function nav(i){state.page='home';state.tab=i;state.course=null;render()}
function say(text){if(!state.voice||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='es-PE';u.rate=.86;window.speechSynthesis.speak(u)}
function image(p=false,cls=''){return `<div class="art ${p?'pet':''} ${cls}"><img class="${p?'fur'+state.fur:''}" src="${p?pet:art}" alt="${p?'Mi cuy':'Kusi te saluda'}"></div>`}
const button=(text,action,outline=false)=>`<button class="${outline?'outline':'primary'}" onclick="${action}">${text}</button>`;
const locked=t=>`<div class="locked"><span>🔒</span><div><strong>${t}</strong><small>Próximamente</small></div></div>`;
function header(text,back=false,logo=false){return `<header class="header">${back?`<button class="iconbtn" aria-label="Volver" onclick="back()">←</button>`:(!logo?`<img class="mini-avatar" src="${art}" alt="">`:'')}<${logo?'div':'h1'} class="${logo?'logo':''}">${text}</${logo?'div':'h1'}><button class="iconbtn" aria-label="Escuchar" onclick="say('${esc(text)}')">◖))</button></header>`}
function back(){if(state.course){state.course=null;render()}else if(state.page==='pet'&&state.user){go('home')}else{go('welcome')}}
function demo(){state.demo=true;state.user={nombre:'Mateo'};state.games=examples;go('pet')}
function savePet(){localStorage.setItem('kusi_fur',state.fur);go('home')}
function activity(item){let status=item.status??(item.nuevo?'new':'');let done=status==='done',pause=status==='pause';return `<article class="activity"><div class="symbol">🔢</div><div class="details"><span class="pill ${pause?'pause':done?'done':''}">${done?'✓ Terminada':pause?'A medias':'Nueva'}</span><h3>${esc(item.titulo)}</h3>${button(done?'Jugar otra vez →':pause?'Continuar →':'Jugar →',`play('${esc(item.id)}')`,done)}</div></article>`}
function render(){let html='',p=state.page,name=esc(state.user?.nombre?.split(' ')[0]||'Mateo');if(state.demo&&p!=='welcome'&&p!=='login')html+='<div class="demo-note">VISTA DE PRUEBA · DATOS DE EJEMPLO</div>';
if(p==='welcome'){html+=header('Kusi',false,true)+`<div class="body welcome">${image()}<h2 class="title">Ven, vamos a<br>la aventura</h2><p class="caption">Un mundo por descubrir,<br>a tu propio ritmo.</p>${button('¡Vamos! →',"go('login')")}<button class="textbtn" onclick="demo()">Explorar el diseño sin una cuenta</button></div>`}
else if(p==='login'){html+=header('Kusi',true,true)+`<div class="body">${image(false,'small')}<h2 class="title">¡Vamos a entrar!</h2><p class="caption">Tu profe te dará los datos de acceso.</p><form onsubmit="login(event)"><label class="input"><span>♙</span><input aria-label="Mi DNI" name="dni" placeholder="Mi DNI" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" required value="${esc(localStorage.getItem('kusi_dni')||'')}" autocomplete="username"></label><label class="input"><span>♧</span><input id="password" aria-label="Mi contraseña" name="password" placeholder="Mi contraseña" type="password" required autocomplete="current-password"><button type="button" aria-label="Mostrar contraseña" onclick="$('#password').type=$('#password').type==='password'?'text':'password'">◉</button></label><label class="check"><input name="remember" type="checkbox" checked>Recordar mi DNI</label>${state.error?`<p class="error" role="alert">${esc(state.error)}</p>`:''}<button class="primary" id="login-btn" type="submit">Entrar →</button></form><button class="textbtn" onclick="help()">Necesito ayuda</button><button class="textbtn" onclick="demo()">Probar sin una cuenta</button></div>`}
else if(p==='pet'){html+=header('Crea tu cuy',true)+`<div class="body">${image(true)}<h2 class="title" style="font-size:25px">Un amigo como tú</h2><p class="section-label">Elige su pelaje</p><div class="fur-grid">${['Café','Crema','Gris','Caramelo'].map((t,i)=>`<button class="fur ${state.fur===i?'selected':''}" aria-pressed="${state.fur===i}" onclick="state.fur=${i};render()"><img class="fur${i}" src="${pet}" alt="">${t}</button>`).join('')}</div>${locked('Ropa')}${locked('Accesorios')}<p style="text-align:center;font-size:25px;opacity:.45;margin:17px 0">🧢　🎒　👓　🌼</p>${button('¡Listo!',"savePet()")}</div>`}
else{let title=state.course||['¡Hola, '+name+'!','Mis cursos','Mis logros','Mi cuy '+name][state.tab];html+=header(title,!!state.course);html+='<div class="body">';
if(state.course){let items=state.demo&&state.course==='Matemática'?state.games:state.games.filter(g=>g.curso===state.course);html+=items.length?items.map(activity).join(''):`${image()}<h2 class="title empty-title">Pronto habrá<br>aventuras aquí</h2><p class="caption">Tu profe te avisará.</p>${button('Ver otros cursos →',"state.course=null;render()")}`}
else if(state.tab===0){html+=`<div class="banner"><strong>Hoy puede ser<br>una gran aventura</strong><img src="${art}" alt=""></div>`;if(state.error)html+=`<p class="error">${esc(state.error)}</p>${button('Volver a buscar','loadGames()',true)}`;else if(!state.games.length)html+=`${image()}<h2 class="title">Tus aventuras<br>están por llegar</h2><p class="caption">Tu profe te avisará.</p>${button('⟳ Buscar juegos nuevos','loadGames()')}${button('Ver cursos',"nav(1)",true)}`;else html+=`<div class="rowtitle"><h2>Tus aventuras</h2><small>Un mundo por descubrir</small></div>${state.games.slice(0,2).map(activity).join('')}<p class="caption" style="margin:20px 0 3px">Te falta jugar</p>${button('📖 Ver actividades',"state.course='Matemática';state.tab=1;render()",true)}`}
else if(state.tab===1)html+=`<div class="course-grid">${courses.map(c=>`<button class="course" style="--tint:${c[2]}" onclick="state.course='${c[0]}';render()"><span>${c[1]}</span><strong>${c[0]}</strong>→</button>`).join('')}</div>`;
else if(state.tab===2)html+=`<div class="points"><img src="${art}" alt="Kusi"><div class="info"><div class="cup">🏆</div><h2>Mis puntos</h2><span class="pronto">Pronto</span></div></div><p class="section-label">Mis medallas</p><div class="medals"><div><span>🏅</span>Primera<br>aventura</div><div><span>🏅</span>Pronto</div><div><span>🏅</span>Pronto</div></div><div class="panel"><h2>Avance por curso</h2><div style="font-size:23px">🔢 📖 🐹 🌎 🎨 💛</div><p>Aquí verás tu avance.</p><span class="pronto">Pronto</span></div><p class="caption" style="font-size:11px">Disponibilidad y puntos desde el servidor.</p>`;
else html+=`${image(true)}${button('🎨 Cambiar pelaje',"go('pet')")}${locked('Ropa y accesorios')}<p class="section-label" style="margin-top:25px">Sonido</p>${locked('Música y efectos')}<label class="toggle-row"><span>◖))　Voz de Kusi</span><input class="toggle" aria-label="Voz de Kusi" type="checkbox" ${state.voice?'checked':''} onchange="state.voice=this.checked;localStorage.setItem('kusi_voice',state.voice);if(state.voice)say('Hola, soy Kusi. Vamos a aprender juntos.')"></label>${button('⇥ Cerrar sesión','exitDialog()',true)}<p class="caption" style="font-size:11px;margin-top:3px">Te pediremos confirmar.</p>`;
html+='</div><nav class="nav" aria-label="Navegación principal">'+[['⌂','Inicio'],['▣','Cursos'],['♜','Logros'],['🐹','Mi cuy']].map((n,i)=>`<button aria-current="${state.tab===i?'page':'false'}" class="${state.tab===i?'active':''}" onclick="nav(${i})"><span>${n[0]}</span>${n[1]}</button>`).join('')+'</nav>'}
$('#app').innerHTML=html;}
async function api(path,data){let r=await fetch((location.port==='5191'?'http://127.0.0.1:5190':'')+path,{method:data?'POST':'GET',credentials:'include',headers:data?{'Content-Type':'application/json','X-CSRFToken':csrf}:{},body:data?JSON.stringify(data):undefined});let d;try{d=await r.json()}catch{throw Error('No pudimos conectar con Kusi. Inténtalo de nuevo.')}if(!r.ok)throw Error(d.mensaje||'No se pudo completar la solicitud.');if(d.csrf_token)csrf=d.csrf_token;return d}
async function login(e){e.preventDefault();let form=new FormData(e.target),btn=$('#login-btn');btn.disabled=true;btn.textContent='Entrando…';try{await api('/api/acceso/sesion/');let d=await api('/api/acceso/ingreso/',{dni:form.get('dni'),contrasena:form.get('password')});if(!d.usuario.roles.includes('estudiante'))throw Error('La app móvil es para estudiantes. Usa el panel web para docentes y administración.');state.user=d.usuario;state.demo=false;if(form.get('remember'))localStorage.setItem('kusi_dni',form.get('dni'));else localStorage.removeItem('kusi_dni');go('pet');loadGames()}catch(e){state.error=e.message;render()}}
async function loadGames(){if(state.demo){state.games=examples;state.error=null;render();return}try{state.games=(await api('/api/edu/estudiante/juegos/')).juegos;state.error=null}catch(e){state.error='No pudimos buscar aventuras. Inténtalo de nuevo.'}render()}
function help(){$('#modal').innerHTML='<div class="overlay"><div class="dialog"><h2>Estamos para ayudarte</h2><p>Pide a tu profe tu DNI y contraseña. Si los olvidaste, tu profe puede ayudarte a recuperar el acceso.</p>'+button('Entendido',"$('#modal').innerHTML=''",true)+'</div></div>'}
function exitDialog(){$('#modal').innerHTML=`<div class="overlay"><div class="dialog"><div style="font-size:51px">🚪🔒</div><h2>¿Quieres salir?</h2><p>Para volver, necesitarás tu cuenta.</p>${button('⌂ Seguir jugando',"$('#modal').innerHTML=''")}<button class="hold" onpointerdown="holdStart(event)" onpointerup="holdEnd()" onpointercancel="holdEnd()" onpointerleave="holdEnd()"><span>✋ Mantén para salir</span></button><p style="margin-bottom:0">Mantén pulsado 3 segundos.</p></div></div>`}
let holding=0,timer;
function holdStart(e){e.preventDefault();let btn=e.currentTarget;holding=Date.now();timer=setInterval(()=>{let p=Math.min(100,(Date.now()-holding)/30);btn.style.setProperty('--progress',p+'%');if(p>=100){clearInterval(timer);logout()}},35)}
function holdEnd(){clearInterval(timer);let btn=$('.hold');if(btn)btn.style.setProperty('--progress','0%')}
async function logout(){holdEnd();if(!state.demo){try{await api('/api/acceso/salida/',{})}catch{}}window.speechSynthesis?.cancel();state.user=null;state.demo=false;state.games=[];state.page='welcome';$('#modal').innerHTML='';render()}
function play(id){$('#modal').innerHTML=`<div class="game"><header><button class="iconbtn" onclick="$('#modal').innerHTML=''">←</button><strong>Laberinto de práctica</strong><span>No registra puntos</span></header><iframe src="../juego/index.html" title="Laberinto de Kusi"></iframe></div>`}
render();
</script></body></html>
