<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorrido de presentación</title>
<style>body{margin:0;padding:18px 28px;background:#eaf8ff;color:#193e48;font:18px system-ui}h1{font-size:26px;margin:0 0 8px}p{margin:8px 0 18px}.acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}button{min-height:62px;border:0;border-radius:18px;background:#146d58;color:white;font:700 18px system-ui;box-shadow:0 4px 0 #0b4538;transition:transform .15s,box-shadow .15s}button:active{transform:translateY(4px) scale(.96);box-shadow:none}button:last-child{background:#ffc43b;color:#49250b;box-shadow:0 4px 0 #bd8010}button:focus-visible{outline:3px solid #246d95;outline-offset:4px}#aviso{min-height:28px;font-weight:700}small{font-size:13px}@media(prefers-reduced-motion:reduce){button{transition:none}}@media(max-width:560px){.acciones{grid-template-columns:repeat(2,1fr)}}</style>
<h1>Probamos el recorrido</h1><p>Estos botones representan los avisos que enviará el juego.</p>
<div class="acciones"><button onclick="aviso('inicio')">Empezar</button><button onclick="aviso('acierto')">Acerté</button><button onclick="aviso('error')">Me equivoqué</button><button onclick="aviso('ayuda')">Pedir ayuda</button><button onclick="aviso('reto-completado')">Completar reto</button><button onclick="aviso('fin')">Terminar</button></div>
<p id="aviso" role="status">Toca un botón para probar.</p><small>Demostración visual: no es el juego generado y no guarda en el servidor.</small>
<script>function aviso(tipo){document.getElementById('aviso').textContent='Aviso de prueba: '+tipo;if(window.KusiPuente)KusiPuente.emitir(tipo)}</script></html>
