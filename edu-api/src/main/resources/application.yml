server:
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${EDU_DB_URL:jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DATABASE:kusi}}
    username: ${EDU_DB_USER:${PG_USER:postgres}}
    password: ${EDU_DB_PASSWORD:${PG_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    default-schema: edu
    schemas: edu
    create-schemas: true
    baseline-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: edu
        format_sql: true
kusi:
  django-url: ${DJANGO_INTERNAL_URL:http://127.0.0.1:8000}
  internal-key: ${CLAVE_INTERNA:}
  # Clave del trabajador del taller (encabezado X-Taller-Clave). Vacía: el buzón responde 503.
  taller-clave: ${TALLER_CLAVE:}
  # Quién escribe la propuesta: «taller» (por el buzón; la IA directa queda de respaldo) o
  # «ia» (siempre la IA directa, Groq o Tecsup).
  propuestas-por: ${PROPUESTAS_POR:taller}
  # Segundos que se espera a que el taller tome el pedido y a que lo entregue antes de usar el respaldo.
  propuesta-espera-taller-seg: ${PROPUESTA_ESPERA_TALLER_SEG:60}
  propuesta-tiempo-taller-seg: ${PROPUESTA_TIEMPO_TALLER_SEG:480}
